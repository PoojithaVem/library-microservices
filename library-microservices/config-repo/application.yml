# Shared defaults applied to ALL services that import from this config server,
# regardless of application name. Service-specific files (below) can override
# any of these.
app:
  loan:
    period-days: 14   # centralized business rule: how long a loan lasts
  kafka:
    topics:
      # Single source of truth for the topic name - loan-service (producer)
      # and notification-service (consumer) both read this same property,
      # so the two can never drift apart by one hardcoding "loan-events" and
      # the other hardcoding "loan_events" or similar.
      loan-events: loan-events

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
