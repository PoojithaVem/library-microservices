server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false   # we define explicit routes below rather than auto-mapping every service
      routes:
        - id: book-service
          uri: lb://book-service
          predicates:
            - Path=/api/books/**

        - id: member-service
          uri: lb://member-service
          predicates:
            - Path=/api/members/**,/api/auth/**

        - id: loan-service
          uri: lb://loan-service
          predicates:
            - Path=/api/loans/**

eureka:
  client:
    service-url:
      defaultZone: http://discovery-server:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,gateway
