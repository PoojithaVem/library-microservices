apiVersion: v1
kind: ConfigMap
metadata:
  name: member-service-config
  namespace: library-system
data:
  DB_HOST: "postgres"
  DB_NAME: "member_db"
  EUREKA_HOST: "discovery-server"
---
apiVersion: v1
kind: Secret
metadata:
  name: jwt-secret
  namespace: library-system
type: Opaque
stringData:
  # In real prod this comes from a vault/secret manager (e.g. mounted via a
  # CSI driver from Azure Key Vault) - never committed to source control.
  JWT_SECRET: "demo-only-secret-key-please-override-in-prod-1234567890"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: member-service
  namespace: library-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: member-service
  template:
    metadata:
      labels:
        app: member-service
    spec:
      containers:
        - name: member-service
          image: library/member-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: member-service-config
            - secretRef:
                name: jwt-secret
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: POSTGRES_PASSWORD
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: member-service
  namespace: library-system
spec:
  selector:
    app: member-service
  ports:
    - port: 8082
      targetPort: 8082
