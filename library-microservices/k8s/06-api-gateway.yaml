apiVersion: v1
kind: ConfigMap
metadata:
  name: api-gateway-config
  namespace: library-system
data:
  EUREKA_HOST: "discovery-server"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: library-system
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: library/api-gateway:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: api-gateway-config
          resources:
            requests:
              cpu: 200m
              memory: 384Mi
            limits:
              cpu: 750m
              memory: 768Mi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 20
---
# LoadBalancer type: the single external entry point into the whole system.
# On a cloud provider (e.g. AKS) this provisions a real external IP; locally
# (minikube/kind) use `kubectl port-forward` or NodePort instead.
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: library-system
spec:
  type: LoadBalancer
  selector:
    app: api-gateway
  ports:
    - port: 80
      targetPort: 8080
