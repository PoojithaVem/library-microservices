server:
  port: 8082

spring:
  application:
    name: member-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:member_db}
    username: ${DB_USER:library_user}
    password: ${DB_PASSWORD:library_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# In real prod this comes from a vault/secret manager, never checked into git.
# Demo default below is fine for local docker-compose only.
jwt:
  secret: ${JWT_SECRET:demo-only-secret-key-please-override-in-prod-1234567890}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.library.memberservice: DEBUG
