server:
  port: 8082

spring:
  application:
    name: member-service
  config:
    import: "optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:8888"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:member_db}
    username: ${DB_USER:library_user}
    password: ${DB_PASSWORD:library_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

# The secret itself deliberately stays here (env-var driven) rather than in
# config-server's plaintext YAML files - a plain Config Server (no encryption/
# vault backend) is not where real secrets belong. expiration-ms, by contrast,
# IS centralized in config-repo/member-service.yml since it's a policy value,
# not a secret - local value below is just the fallback if config-server is down.
jwt:
  secret: ${JWT_SECRET:demo-only-secret-key-please-override-in-prod-1234567890}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.library.memberservice: DEBUG
