server:
  port: 8083

spring:
  application:
    name: loan-service
  config:
    import: "optional:configserver:http://${CONFIG_SERVER_HOST:localhost}:8888"
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:loan_db}
    username: ${DB_USER:library_user}
    password: ${DB_PASSWORD:library_pass}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true   # wraps every Feign call with a Resilience4j circuit breaker
  kafka:
    bootstrap-servers: ${KAFKA_BROKER:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all   # wait for all in-sync replicas - stronger durability than the default "1"
      properties:
        # By default, Spring's JsonSerializer stamps a header with the exact
        # producer-side class name (com.library.loanservice.dto.LoanEvent).
        # notification-service has its OWN copy of LoanEvent in a different
        # package (com.library.notificationservice.dto.LoanEvent) - if the
        # consumer trusts that header, it tries to load a class that doesn't
        # exist on its classpath and silently fails to deserialize. Disabling
        # type headers here forces the consumer to rely on its own configured
        # target type (spring.json.value.default.type) instead - the correct
        # pattern whenever producer and consumer are different services with
        # their own copies of the same DTO shape.
        spring.json.add.type.headers: false
        # Prevents duplicate events if a producer retry happens after a
        # transient broker hiccup - same "exactly-once at the producer" idea
        # discussed in interview prep, applied here rather than just talked about.
        enable.idempotence: true

# Local fallback if config-server is unreachable - the real value lives in
# config-repo/application.yml (shared across loan-service AND notification-service,
# so both sides agree on the topic name without duplicating it in two codebases).
app:
  kafka:
    topics:
      loan-events: loan-events

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:8761/eureka/
  instance:
    prefer-ip-address: true

# Timeouts so a slow book-service/member-service can't hang loan-service threads.
# NOTE: this block and the resilience4j block below are now ALSO centralized
# in config-repo/loan-service.yml on config-server; kept here too as the local
# fallback for when config-server is unreachable (see "optional:" prefix
# above) - Spring merges both, with config-server's values taking precedence
# when it's reachable.
feign:
  client:
    config:
      default:
        connectTimeout: 3000
        readTimeout: 5000

resilience4j:
  circuitbreaker:
    instances:
      book-service:
        sliding-window-size: 10
        failure-rate-threshold: 50        # open the circuit if >=50% of the last 10 calls fail
        wait-duration-in-open-state: 10s   # stay open 10s before trying half-open
        permitted-number-of-calls-in-half-open-state: 3
      member-service:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
        permitted-number-of-calls-in-half-open-state: 3
  timelimiter:
    instances:
      book-service:
        timeout-duration: 4s
      member-service:
        timeout-duration: 4s

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,circuitbreakers
  endpoint:
    health:
      show-details: always
  health:
    circuitbreakers:
      enabled: true

logging:
  level:
    com.library.loanservice: DEBUG
    com.library.loanservice.client: DEBUG   # shows Feign request/response logs
